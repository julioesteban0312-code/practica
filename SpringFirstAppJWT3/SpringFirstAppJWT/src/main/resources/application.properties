
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=
spring.jpa.open-in-view=false

server.port= 8080
#para ver el sql en la consola para testeo
#spring.jpa.show-sql: true

# Configuraci�n JWT
jwt.secret=secureJwtSecretKeyForSpringFirstAppJWTImplementation

# Configuraci�n de Swagger
springdoc.swagger-ui.path=/
# Prevenir escape de HTML en la documentaci�n de Swagger
springdoc.swagger-ui.docExpansion=none
springdoc.swagger-ui.syntaxHighlight.activated=true
springdoc.swagger-ui.syntaxHighlight.theme=markdown
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.supportedSubmitMethods=["get", "post", "put", "delete"]
# Estas son las propiedades clave para prevenir el escape de HTML
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.html-escaping.enabled=false
